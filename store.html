<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store | Threadline</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html">Threadline</a>
        <nav class="nav" aria-label="Main navigation">
          <a class="nav-link" href="./index.html">Home</a>
          <a class="nav-link" href="./about.html">About</a>
          <a class="nav-link active" href="./store.html">Store</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-banner">
        <div class="container">
          <h1>Shop All</h1>
          <p>Browse our full collection of everyday essentials.</p>
        </div>
      </section>

      <section class="section container">
        <div id="product-grid" class="product-grid" aria-live="polite"></div>

        <div class="pagination" aria-label="Product pages">
          <button id="prev-btn" class="page-btn" type="button">Previous</button>
          <span id="page-indicator" class="page-indicator">Page 1 of 3</span>
          <button id="next-btn" class="page-btn" type="button">Next</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 Threadline. All rights reserved.</p>
        <p>Store hours: Mon-Sat 10am-8pm, Sun 12pm-6pm</p>
        <p class="socials">
          <a href="#">Instagram</a>
          <a href="#">TikTok</a>
          <a href="#">Pinterest</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
